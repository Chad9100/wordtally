[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordtally"
version = "0.1.0"
description = "Text analysis library and CLI: word frequency, readability scores, repeated phrases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chad Mowlavie", email = "mowlaviec@gmail.com" }]
keywords = ["text analysis", "readability", "word frequency", "nlp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
wordtally = "wordtally.cli:main"

[project.urls]
Homepage = "https://github.com/Chad9100/wordtally"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wordtally = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
